limit_req_zone $binary_remote_addr zone=apk_html_per_ip:50m rate=10r/s;

log_format apk_html_json escape=json
'{"time":"$time_iso8601",'
'"request_id":"$request_id",'
'"remote_addr":"$remote_addr",'
'"host":"$host",'
'"http_host":"$http_host",'
'"forwarded_host":"$http_x_forwarded_host",'
'"method":"$request_method",'
'"uri":"$request_uri",'
'"status":$status,'
'"bytes":$body_bytes_sent,'
'"referer":"$http_referer",'
'"user_agent":"$http_user_agent",'
'"request_time":$request_time,'
'"upstream_response_time":"$upstream_response_time"}';

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 10m;
    keepalive_timeout 15s;

    access_log /var/log/nginx/apk_html_access.json apk_html_json;
    error_log /var/log/nginx/apk_html_error.log warn;

    location = /__nginx_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /healthz {
        access_log off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://web:8080;
    }

    location = /robots.txt {
        default_type text/plain;
        return 404;
    }

    location = /sitemap.xml {
        default_type text/plain;
        return 404;
    }

    location ^~ /assets/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://web:8080;
    }

    location / {
        include /etc/nginx/snippets/apk-html-bot-filter.conf;
        limit_req zone=apk_html_per_ip burst=40 nodelay;
        limit_req_status 429;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://web:8080;
    }
}
