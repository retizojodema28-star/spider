root = "."
tmp_dir = "_output/air"

[build]
cmd = "make build BINS=site"
bin = "_output/bin/site"
include_ext = ["go", "html", "tmpl", "tpl"]
exclude_dir = [".git", "_output", "assets", "data", "docs", "storage"]
exclude_regex = ["_test\\.go"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = "2s"

[log]
time = true

[misc]
clean_on_exit = true
